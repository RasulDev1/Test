<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 class="title">Выбери свой продукт</h1>
    <button class="button" id="change-color-all">Поменять цвет всех карточек</button>
    <button class="button" id="change-color-first">Поменять цвет первой карточки</button>
    <button class="button" id="open-google">Открыть Google</button>
    <button class="button" id="output-console-log">Вывести сообщение в консоль лог</button>
    <button class="button color" id="change-color">Переключение цвета кнопки</button>

    <ul id="product-card-list"></ul>

    <template id = "product-card-template">
      <li class="product-card">
        <img src="" alt="" class="product-card__image"/>
        <div class="product-card__clue"></div>
        <div class="product-card__name"></div>
        <p class="product-card__description"> </p>

        <span class="product-card__compound"></span>

        <ul class="product-card__ingridients">  Состав:
          <li></li>
          <li></li>
          <li></li>
        </ul>

        <b class="product-card__price">  Цена </b>
        <span class="product-card__cost"></span>
      </li>
    </template>

    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script src="homework-9.js" defer type="module"></script>
    <script src="comments.js" defer type="module"></script>
    <script src="homework-10.js" defer type="module"></script>
    <script src="product-cards.js" defer type="module"></script>
  </body>
</html>
